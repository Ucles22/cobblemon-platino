name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Inspeccionar Cobblemon (solo si existe tools/INSPECT)
        if: hashFiles('tools/INSPECT') != ''
        run: |
          bash tools/inspect.sh
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-inspect
          git rm -rq --cached . ; git add -f inspect
          git commit -qm "inspect" && git push -f origin ci-inspect
          git checkout -q -f ${{ github.sha }}
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-platino-jar
          path: build/libs/*.jar
