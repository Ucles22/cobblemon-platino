name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Inspeccionar Cobblemon (solo si existe tools/INSPECT)
        if: hashFiles('tools/INSPECT') != ''
        run: |
          bash tools/inspect.sh
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-inspect
          git rm -rq --cached . ; git add -f inspect
          git commit -qm "inspect" && git push -f origin ci-inspect
          git checkout -q -f ${{ github.sha }}
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle build 2>&1 | tee build.log
      - name: Guardar log si falla
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log || true
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git fetch -q origin ci-inspect && git checkout -q -f FETCH_HEAD
          mkdir -p inspect && cp /tmp/build.log inspect/build-failure.log
          git add -f inspect && git commit -qm "build log" && git push -q origin HEAD:ci-inspect || true
      - name: Guardar refmap para verificación
        if: hashFiles('tools/INSPECT') != ''
        run: |
          mkdir -p /tmp/rm && cd /tmp/rm && unzip -o -q $GITHUB_WORKSPACE/build/libs/$(ls $GITHUB_WORKSPACE/build/libs | grep -v sources | head -1) '*refmap*.json' || true
          cd $GITHUB_WORKSPACE && git fetch -q origin ci-inspect && git checkout -q -f FETCH_HEAD && mkdir -p inspect && cp /tmp/rm/*.json inspect/ 2>/dev/null || true
          git add -f inspect && git commit -qm refmap && git push -q origin HEAD:ci-inspect || true
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-platino-jar
          path: build/libs/*.jar
